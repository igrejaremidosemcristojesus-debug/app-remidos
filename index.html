<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Igreja Remidos em Cristo Jesus - Painel PWA</title>
  <!-- Tailwind CSS para Estilização -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Biblioteca para Geração de QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-6">
    
    <!-- Cabeçalho -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold text-gray-800">Igreja Remidos</h1>
      <p class="text-sm text-gray-500">Cadastro de Membros & Visitantes</p>
    </div>

    <!-- Abas de Navegação -->
    <div class="flex border-b">
      <button id="tabMembroBtn" onclick="mudarAba('membro')" class="w-1/2 py-2 text-center font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none">
        Membro
      </button>
      <button id="tabVisitanteBtn" onclick="mudarAba('visitante')" class="w-1/2 py-2 text-center font-semibold text-gray-500 border-b-2 border-transparent focus:outline-none">
        Visitante
      </button>
    </div>

    <!-- Formulário -->
    <form id="cadastroForm" onsubmit="salvarCadastro(event)" class="space-y-4">
      <input type="hidden" id="tipoCadastro" value="membro">

      <div>
        <label class="block text-sm font-medium text-gray-700">Nome Completo</label>
        <input type="text" id="nome" required placeholder="Digite o nome" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">WhatsApp (com DDD)</label>
        <input type="tel" id="telefone" required placeholder="48999999999" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
      </div>

      <button type="submit" id="btnSalvar" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-blue-700 transition duration-200">
        Cadastrar
      </button>
    </form>

    <!-- Modal / Área de Validação do WhatsApp (QR Code) -->
    <div id="areaQrCode" class="hidden text-center border-t pt-4 space-y-4">
      <div class="bg-green-50 text-green-800 p-3 rounded-lg text-sm font-medium">
        ✅ Cadastrado com sucesso!
      </div>
      
      <p class="text-xs text-gray-600">
        Aponte a câmera do celular do cadastrado para o QR Code abaixo para abrir a conversa no WhatsApp dele:
      </p>

      <!-- Div onde o QR Code é renderizado -->
      <div id="qrcodeCanvas" class="flex justify-center my-2"></div>

      <div class="space-y-2">
        <a id="btnWaLink" href="#" target="_blank" class="block w-full bg-green-600 text-white font-bold py-2 rounded-lg shadow hover:bg-green-700 text-sm">
          Abrir direto no WhatsApp
        </a>
        
        <button onclick="reiniciarFormulario()" class="w-full bg-gray-200 text-gray-700 font-semibold py-2 rounded-lg text-sm hover:bg-gray-300">
          Novo Cadastro
        </button>
      </div>
    </div>

  </div>

  <script>
    // CONFIGURAÇÕES VINCULADAS COM O SEU SISTEMA
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwm0tvqHCqlJe9cqVBVebGbjosVNbet3s3EyynpOzve9vZR389iPBnM2SiYcyBImr1sag/exec";
    const NUMERO_WHATSAPP_IGREJA = "5548991704111";

    function mudarAba(tipo) {
      document.getElementById('tipoCadastro').value = tipo;
      const mBtn = document.getElementById('tabMembroBtn');
      const vBtn = document.getElementById('tabVisitanteBtn');

      if (tipo === 'membro') {
        mBtn.className = "w-1/2 py-2 text-center font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none";
        vBtn.className = "w-1/2 py-2 text-center font-semibold text-gray-500 border-b-2 border-transparent focus:outline-none";
      } else {
        vBtn.className = "w-1/2 py-2 text-center font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none";
        mBtn.className = "w-1/2 py-2 text-center font-semibold text-gray-500 border-b-2 border-transparent focus:outline-none";
      }
    }

    async function salvarCadastro(event) {
      event.preventDefault();
      
      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.innerText = "Cadastrando...";

      const tipo = document.getElementById('tipoCadastro').value;
      const nome = document.getElementById('nome').value.trim();
      const telefone = document.getElementById('telefone').value.trim();

      const dados = {
        tipo: tipo,
        nome: nome,
        telefone: telefone
      };

      try {
        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dados)
        });

        gerarQrCodeEAtivarJanela(nome, tipo);

      } catch (erro) {
        alert("Erro ao conectar com o servidor do Google Apps Script.");
        btn.disabled = false;
        btn.innerText = "Cadastrar";
      }
    }

    function gerarQrCodeEAtivarJanela(nome, tipo) {
      document.getElementById('cadastroForm').classList.add('hidden');
      document.getElementById('areaQrCode').classList.remove('hidden');

      const textoMensagem = encodeURIComponent(`Olá! Sou ${nome} e gostaria de receber os devocionais e avisos da Igreja Remidos.`);
      const linkWa = `https://wa.me/${NUMERO_WHATSAPP_IGREJA}?text=${textoMensagem}`;

      // Atualiza o link do botão para clique direto
      document.getElementById('btnWaLink').href = linkWa;

      // Limpa QR code anterior e gera o novo
      const containerQr = document.getElementById('qrcodeCanvas');
      containerQr.innerHTML = "";
      
      new QRCode(containerQr, {
        text: linkWa,
        width: 160,
        height: 160,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });
    }

    function reiniciarFormulario() {
      document.getElementById('nome').value = "";
      document.getElementById('telefone').value = "";
      document.getElementById('btnSalvar').disabled = false;
      document.getElementById('btnSalvar').innerText = "Cadastrar";
      document.getElementById('cadastroForm').classList.remove('hidden');
      document.getElementById('areaQrCode').classList.add('hidden');
    }
  </script>
</body>
</html>
